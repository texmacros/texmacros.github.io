<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>texmacros</title>
  <style>
    * { box-sizing: border-box; margin: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 20px;
      background: #1E1230;
      font-family: Roboto, Arial, sans-serif;
      color: #CCC2DC;
      overflow-x: hidden;
    }

    .bubbles {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .bubble {
      position: absolute;
      bottom: -140px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(208,188,255,.35), rgba(208,188,255,.06));
      border: 1px solid rgba(208,188,255,.25);
      animation: rise linear infinite;
    }

    @keyframes rise {
      0%   { transform: translate(0, 0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translate(var(--drift), calc(-100vh - 280px)); opacity: 0; }
    }

    /* ---------- player ---------- */
    .player {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 12px;
      background: rgba(43, 27, 61, .85);
      backdrop-filter: blur(6px);
      border-radius: 999px;
      animation: fadeUp .8s ease both;
    }

    .play-btn {
      flex: none;
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 50%;
      background: #D0BCFF;
      color: #381E72;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform .2s ease;
    }

    .play-btn:active { transform: scale(.92); }
    .play-btn svg { width: 24px; height: 24px; }
    .play-btn .pause { display: none; }
    .player.playing .play-btn .play { display: none; }
    .player.playing .play-btn .pause { display: block; }

    .mid {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .wave {
      position: relative;
      height: 28px;
      cursor: pointer;
      touch-action: pan-y;
      user-select: none;
      -webkit-user-select: none;
    }

    .wave-layer {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      overflow: hidden;
    }

    .wave-bg { width: 100%; }
    .wave-fg { width: 0%; }

    .wave svg {
      display: block;
      animation: flow 3s linear infinite;
      animation-play-state: paused;
    }

    .player.playing .wave svg { animation-play-state: running; }

    @keyframes flow {
      from { transform: translateX(0); }
      to   { transform: translateX(-12px); }
    }

    .wave path {
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
    }

    .wave-bg path { stroke: rgba(208,188,255,.3); }
    .wave-fg path { stroke: #D0BCFF; }

    .thumb {
      position: absolute;
      top: 50%;
      left: 0%;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #EADDFF;
      box-shadow: 0 0 0 3px rgba(208,188,255,.25);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .time {
      font-size: 12px;
      line-height: 14px;
      text-align: right;
      color: #CCC2DC;
      font-variant-numeric: tabular-nums;
    }

    .cover {
      flex: none;
      position: relative;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      overflow: hidden;
      background: #4A3A63;
      color: #EADDFF;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cover svg { width: 24px; height: 24px; }

    .cover img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .player.playing .cover { animation: spin 14s linear infinite; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ---------- card ---------- */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      padding: 40px 24px 48px;
      text-align: center;
      background: rgba(43, 27, 61, .85);
      backdrop-filter: blur(6px);
      border-radius: 32px;
      animation: fadeUp .8s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      display: block;
      width: 112px;
      height: 112px;
      margin: 0 auto 20px;
      object-fit: cover;
      border-radius: 36%;
      border: 3px solid #4A3A63;
      background: #4A3A63;
    }

    h1 { font-size: 34px; color: #EADDFF; }
    .meta { margin-top: 8px; font-size: 18px; }

    .links {
      margin-top: 32px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 24px;
      border-radius: 999px;
      background: #4A3A63;
      color: #EADDFF;
      text-decoration: none;
      font-size: 16px;
      transition: transform .2s ease;
    }

    .btn:active { transform: scale(.96); }
    .btn.primary { background: #D0BCFF; color: #381E72; }

    /* ---------- photo buttons ---------- */
    .actions {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      animation: fadeUp .8s ease both;
    }

    .chip {
      border: 0;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(74, 58, 99, .9);
      color: #EADDFF;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      transition: transform .2s ease, opacity .2s ease;
    }

    .chip:active { transform: scale(.95); }
    .chip:disabled { opacity: .45; cursor: default; }

    /* ---------- photo viewer ---------- */
    .viewer {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(18, 10, 28, .8);
      backdrop-filter: blur(6px);
    }

    .viewer[hidden] { display: none; }

    .viewer-box {
      width: 100%;
      max-width: 480px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #2B1B3D;
      border-radius: 32px;
      animation: fadeUp .3s ease both;
    }

    .viewer-img {
      position: relative;
      min-height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #1E1230;
      border-radius: 24px;
    }

    .viewer-img img {
      display: block;
      width: 100%;
      max-height: 60vh;
      object-fit: contain;
      transition: opacity .2s ease;
    }

    .viewer-img img.loading { opacity: 0; }

    .spinner {
      position: absolute;
      width: 32px;
      height: 32px;
      border: 4px solid rgba(208,188,255,.25);
      border-top-color: #D0BCFF;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .viewer-msg {
      position: absolute;
      padding: 0 20px;
      text-align: center;
      font-size: 15px;
    }

    .viewer-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .viewer-bar .src {
      margin-right: auto;
      padding-left: 8px;
      font-size: 12px;
      color: #CCC2DC;
    }

    @media (prefers-reduced-motion: reduce) {
      .bubble, .card, .player, .actions, .viewer-box, .wave svg, .player.playing .cover { animation: none; }
      .bubble { display: none; }
    }
  </style>
</head>
<body>
  <div class="bubbles" id="bubbles"></div>

  <div class="player" id="player">
    <button class="play-btn" id="playBtn" aria-label="Music">
      <svg class="play" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
      <svg class="pause" viewBox="0 0 24 24"><path fill="currentColor" d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>

    <div class="mid">
      <div class="wave" id="wave">
        <div class="wave-layer wave-bg"><svg><path/></svg></div>
        <div class="wave-layer wave-fg" id="waveFg"><svg><path/></svg></div>
        <div class="thumb" id="thumb"></div>
      </div>
      <div class="time" id="timeLeft">-:--</div>
    </div>

    <div class="cover">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
      <img src="cover.jpg" alt="" onerror="this.style.display='none'">
    </div>
  </div>

  <main class="card">
    <img class="avatar" src="avatar.jpg" alt="texmacros"
         onerror="this.onerror=null;this.src='https://github.com/texmacros.png'">
    <h1>texmacros</h1>
    <p class="meta">13.10.2005 · tashkent</p>

    <div class="links">
      <a class="btn primary" href="https://t.me/texmac">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M9.78,18.65L10.06,14.42L17.74,7.5C18.08,7.19 17.67,7.04 17.22,7.31L7.74,13.3L3.64,12C2.76,11.75 2.75,11.14 3.84,10.7L19.81,4.54C20.54,4.21 21.24,4.72 20.96,5.84L18.24,18.65C18.05,19.56 17.5,19.78 16.74,19.36L12.6,16.3L10.61,18.23C10.38,18.46 10.19,18.65 9.78,18.65Z"/></svg>
        @texmac
      </a>
      <a class="btn" href="mailto:texmacros@gmail.com">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 7l9 6 9-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        texmacros@gmail.com
      </a>
      <a class="btn" href="tel:+998338696969">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
        +998 33 869 69 69
      </a>
    </div>
  </main>

  <div class="actions">
    <button class="chip" data-kind="kpop">random k-pop photo</button>
    <button class="chip" data-kind="cats">random cats photo</button>
  </div>

  <div class="viewer" id="viewer" hidden>
    <div class="viewer-box">
      <div class="viewer-img">
        <img id="viewerImg" class="loading" alt="">
        <div class="spinner" id="spinner"></div>
        <div class="viewer-msg" id="viewerMsg" hidden></div>
      </div>
      <div class="viewer-bar">
        <a class="src" id="viewerSrc" href="#" target="_blank" rel="noopener" hidden>source</a>
        <button class="chip" id="saveBtn" disabled>save</button>
        <button class="chip" id="againBtn">next</button>
        <button class="chip" id="closeBtn">close</button>
      </div>
    </div>
  </div>

  <audio id="audio" src="music.mp3" loop preload="metadata"></audio>

  <script>
    /* bubbles */
    var box = document.getElementById('bubbles');
    for (var i = 0; i < 18; i++) {
      var b = document.createElement('span');
      var size = 20 + Math.random() * 70;
      b.className = 'bubble';
      b.style.width = b.style.height = size + 'px';
      b.style.left = Math.random() * 100 + '%';
      b.style.animationDuration = (9 + Math.random() * 10) + 's';
      b.style.animationDelay = (-Math.random() * 18) + 's';
      b.style.setProperty('--drift', (Math.random() * 80 - 40) + 'px');
      box.appendChild(b);
    }

    /* wave */
    var wave = document.getElementById('wave');
    var waveFg = document.getElementById('waveFg');
    var thumb = document.getElementById('thumb');
    var timeLeft = document.getElementById('timeLeft');
    var svgs = wave.querySelectorAll('svg');

    function drawWave() {
      var W = wave.clientWidth;
      var n = Math.ceil((W + 24) / 6) + 1;
      var d = 'M0 14 q3 -4 6 0';
      for (var k = 1; k < n; k++) d += ' t6 0';
      for (var j = 0; j < svgs.length; j++) {
        var s = svgs[j];
        s.setAttribute('width', W + 24);
        s.setAttribute('height', 28);
        s.setAttribute('viewBox', '0 0 ' + (W + 24) + ' 28');
        s.querySelector('path').setAttribute('d', d);
      }
    }
    drawWave();
    window.addEventListener('resize', drawWave);

    /* player */
    var audio = document.getElementById('audio');
    var player = document.getElementById('player');
    var playBtn = document.getElementById('playBtn');
    var dragging = false;

    function fmt(sec) {
      sec = Math.max(0, Math.round(sec));
      var m = Math.floor(sec / 60);
      var s = sec % 60;
      return '-' + m + ':' + (s < 10 ? '0' : '') + s;
    }

    function show(ratio) {
      var pct = ratio * 100;
      waveFg.style.width = pct + '%';
      thumb.style.left = pct + '%';
      if (audio.duration) {
        timeLeft.textContent = fmt(audio.duration * (1 - ratio));
      }
    }

    function syncFromAudio() {
      if (dragging || !audio.duration) return;
      show(audio.currentTime / audio.duration);
    }

    playBtn.addEventListener('click', function () {
      if (audio.paused) {
        audio.play().then(function () {
          player.classList.add('playing');
        }).catch(function () {});
      } else {
        audio.pause();
        player.classList.remove('playing');
      }
    });

    audio.addEventListener('timeupdate', syncFromAudio);
    audio.addEventListener('loadedmetadata', syncFromAudio);

    function ratioFrom(e) {
      var r = wave.getBoundingClientRect();
      return Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1);
    }

    wave.addEventListener('pointerdown', function (e) {
      if (!audio.duration) return;
      dragging = true;
      wave.setPointerCapture(e.pointerId);
      show(ratioFrom(e));
    });

    wave.addEventListener('pointermove', function (e) {
      if (dragging) show(ratioFrom(e));
    });

    function endDrag(e) {
      if (!dragging) return;
      dragging = false;
      audio.currentTime = ratioFrom(e) * audio.duration;
    }

    wave.addEventListener('pointerup', endDrag);
    wave.addEventListener('pointercancel', function () {
      dragging = false;
      syncFromAudio();
    });

    /* random photos */
    var viewer = document.getElementById('viewer');
    var viewerImg = document.getElementById('viewerImg');
    var spinner = document.getElementById('spinner');
    var viewerMsg = document.getElementById('viewerMsg');
    var viewerSrc = document.getElementById('viewerSrc');
    var saveBtn = document.getElementById('saveBtn');
    var againBtn = document.getElementById('againBtn');
    var closeBtn = document.getElementById('closeBtn');
    var currentKind = null;
    var currentUrl = null;
    var token = 0;

    function pickRandom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function getCat() {
      return fetch('https://api.thecatapi.com/v1/images/search')
        .then(function (r) { return r.json(); })
        .then(function (j) { return { url: j[0].url, link: null }; })
        .catch(function () {
          return { url: 'https://cataas.com/cat?t=' + Date.now(), link: null };
        });
    }

    function getKpopOnce(offset) {
      var queries = ['K-pop concert', 'K-pop idol', 'K-pop girl group', 'K-pop boy band'];
      var q = pickRandom(queries) + ' filetype:bitmap';
      var url = 'https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*'
        + '&generator=search&gsrnamespace=6&gsrlimit=30&gsroffset=' + offset
        + '&gsrsearch=' + encodeURIComponent(q)
        + '&prop=imageinfo&iiprop=url|mime&iiurlwidth=900';
      return fetch(url)
        .then(function (r) { return r.json(); })
        .then(function (j) {
          var pages = j.query ? Object.keys(j.query.pages).map(function (k) { return j.query.pages[k]; }) : [];
          pages = pages.filter(function (p) {
            var i = p.imageinfo && p.imageinfo[0];
            return i && /^image\/(jpeg|png)$/.test(i.mime) && i.thumburl;
          });
          if (!pages.length) return null;
          var info = pickRandom(pages).imageinfo[0];
          return { url: info.thumburl, link: info.descriptionurl };
        });
    }

    function getKpop() {
      var offsets = [Math.floor(Math.random() * 100), Math.floor(Math.random() * 30), 0];
      var p = Promise.resolve(null);
      offsets.forEach(function (off) {
        p = p.then(function (res) { return res || getKpopOnce(off); });
      });
      return p.then(function (res) {
        if (!res) throw new Error('empty');
        return res;
      });
    }

    function preload(url) {
      return new Promise(function (resolve, reject) {
        var im = new Image();
        im.onload = function () { resolve(url); };
        im.onerror = reject;
        im.src = url;
      });
    }

    function loadPhoto() {
      var my = ++token;
      currentUrl = null;
      saveBtn.disabled = true;
      viewerImg.classList.add('loading');
      spinner.hidden = false;
      viewerMsg.hidden = true;
      viewerSrc.hidden = true;

      var source = currentKind === 'cats' ? getCat() : getKpop();
      source.then(function (res) {
        return preload(res.url).then(function () { return res; });
      }).then(function (res) {
        if (my !== token) return;
        currentUrl = res.url;
        viewerImg.src = res.url;
        viewerImg.classList.remove('loading');
        spinner.hidden = true;
        saveBtn.disabled = false;
        if (res.link) {
          viewerSrc.href = res.link;
          viewerSrc.hidden = false;
        }
      }).catch(function () {
        if (my !== token) return;
        spinner.hidden = true;
        viewerMsg.textContent = 'Could not load the photo. Tap "next" to try again.';
        viewerMsg.hidden = false;
      });
    }

    function savePhoto() {
      if (!currentUrl) return;
      var url = currentUrl;
      saveBtn.disabled = true;
      saveBtn.textContent = 'saving...';

      fetch(url)
        .then(function (r) {
          if (!r.ok) throw new Error('bad response');
          return r.blob();
        })
        .then(function (blob) {
          var ext = (blob.type.split('/')[1] || 'jpg').replace('jpeg', 'jpg');
          var href = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = href;
          a.download = 'texmacros-' + currentKind + '-' + Date.now() + '.' + ext;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(function () { URL.revokeObjectURL(href); }, 2000);
          saveBtn.textContent = 'saved';
        })
        .catch(function () {
          window.open(url, '_blank');
          saveBtn.textContent = 'save';
        })
        .then(function () {
          setTimeout(function () {
            saveBtn.textContent = 'save';
            saveBtn.disabled = !currentUrl;
          }, 1500);
        });
    }

    function openViewer(kind) {
      currentKind = kind;
      viewer.hidden = false;
      loadPhoto();
    }

    function closeViewer() {
      token++;
      currentUrl = null;
      viewer.hidden = true;
      viewerImg.removeAttribute('src');
    }

    document.querySelectorAll('.chip[data-kind]').forEach(function (btn) {
      btn.addEventListener('click', function () { openViewer(btn.dataset.kind); });
    });

    saveBtn.addEventListener('click', savePhoto);
    againBtn.addEventListener('click', loadPhoto);
    closeBtn.addEventListener('click', closeViewer);
    viewer.addEventListener('click', function (e) {
      if (e.target === viewer) closeViewer();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !viewer.hidden) closeViewer();
    });
  </script>
</body>
</html>
