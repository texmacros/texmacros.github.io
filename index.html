<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1E1230" id="themeColor">
  <title>texmacros</title>
  <style>
    /* ---------- color themes ---------- */
    :root {
      --accent-rgb: 208,188,255;
      --bg: #1E1230;
      --surface: rgba(43, 27, 61, .85);
      --surface2: #4A3A63;
      --tile: rgba(74, 58, 99, .55);
      --text: #EADDFF;
      --text2: #CCC2DC;
      --on-accent: #381E72;
    }

    html[data-theme="brown"] {
      --accent-rgb: 232,191,168;
      --bg: #1F140F;
      --surface: rgba(52, 35, 27, .88);
      --surface2: #5A4034;
      --tile: rgba(90, 64, 52, .55);
      --text: #FBE5DA;
      --text2: #D8C2B8;
      --on-accent: #3F2517;
    }

    html[data-theme="teal"] {
      --accent-rgb: 159,214,206;
      --bg: #0E1D1B;
      --surface: rgba(23, 45, 42, .88);
      --surface2: #2F4F4A;
      --tile: rgba(47, 79, 74, .55);
      --text: #D6F2EE;
      --text2: #B2CCC8;
      --on-accent: #00372F;
    }

    html[data-theme="blue"] {
      --accent-rgb: 174,198,255;
      --bg: #0F1829;
      --surface: rgba(24, 36, 64, .88);
      --surface2: #33466E;
      --tile: rgba(51, 70, 110, .55);
      --text: #DCE6FF;
      --text2: #B9C6E4;
      --on-accent: #0B2A63;
    }

    * { box-sizing: border-box; margin: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 76px 20px 88px;
      background: var(--bg);
      font-family: Roboto, Arial, sans-serif;
      color: var(--text2);
      overflow-x: hidden;
      transition: background .4s ease;
    }

    /* ---------- animated background ---------- */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .bubble {
      position: absolute;
      bottom: -140px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(var(--accent-rgb), .35), rgba(var(--accent-rgb), .06));
      border: 1px solid rgba(var(--accent-rgb), .25);
      animation: rise linear infinite;
    }

    @keyframes rise {
      0%   { transform: translate(0, 0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translate(var(--drift), calc(-100vh - 280px)); opacity: 0; }
    }

    .shape {
      position: absolute;
      bottom: -120px;
      color: rgb(var(--accent-rgb));
      opacity: 0;
      animation: float linear infinite;
    }

    .shape svg {
      display: block;
      width: 100%;
      height: 100%;
      animation: turn var(--dur, 20s) linear infinite;
    }

    @keyframes float {
      0%   { transform: translate(0, 0); opacity: 0; }
      10%  { opacity: var(--o, .2); }
      90%  { opacity: var(--o, .2); }
      100% { transform: translate(var(--drift), calc(-100vh - 240px)); opacity: 0; }
    }

    @keyframes turn {
      to { transform: rotate(var(--turn, 360deg)); }
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      will-change: transform;
    }

    .blob.b1 {
      width: 70vmax; height: 70vmax;
      left: -20vmax; top: -20vmax;
      background: rgba(var(--accent-rgb), .22);
      animation: drift1 22s ease-in-out infinite alternate;
    }

    .blob.b2 {
      width: 60vmax; height: 60vmax;
      right: -22vmax; top: 25vh;
      background: var(--surface2);
      opacity: .6;
      animation: drift2 26s ease-in-out infinite alternate;
    }

    .blob.b3 {
      width: 55vmax; height: 55vmax;
      left: 8vmax; bottom: -28vmax;
      background: rgba(var(--accent-rgb), .15);
      animation: drift3 30s ease-in-out infinite alternate;
    }

    @keyframes drift1 { to { transform: translate(18vmax, 12vmax) scale(1.15); } }
    @keyframes drift2 { to { transform: translate(-16vmax, -10vmax) scale(1.1); } }
    @keyframes drift3 { to { transform: translate(14vmax, -14vmax) scale(1.2); } }

    .gridlayer {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(var(--accent-rgb), .32) 1.2px, transparent 1.6px);
      background-size: 26px 26px;
      -webkit-mask-image: radial-gradient(ellipse at 50% 40%, #000 25%, transparent 78%);
      mask-image: radial-gradient(ellipse at 50% 40%, #000 25%, transparent 78%);
      animation: gridmove 40s linear infinite;
    }

    @keyframes gridmove {
      to { background-position: 26px 26px; }
    }

    /* ---------- card ---------- */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      padding: 40px 24px 44px;
      text-align: center;
      background: var(--surface);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 32px;
      animation: fadeUp .8s ease both;
      transition: background .4s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      display: block;
      width: 112px;
      height: 112px;
      margin: 0 auto 20px;
      object-fit: cover;
      border-radius: 36%;
      border: 3px solid var(--surface2);
      background: var(--surface2);
    }

    h1 { font-size: 34px; color: var(--text); }
    .meta { margin-top: 8px; font-size: 18px; }

    /* ---------- contacts ---------- */
    .links {
      margin-top: 32px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 24px;
      border-radius: 999px;
      background: var(--surface2);
      color: var(--text);
      text-decoration: none;
      font-size: 16px;
      transition: transform .2s ease, background .4s ease;
    }

    .btn:active { transform: scale(.96); }
    .btn.primary { background: rgb(var(--accent-rgb)); color: var(--on-accent); }

    /* ---------- language button ---------- */
    .lang {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top, 0px));
      right: 14px;
      z-index: 7;
    }

    .lang-btn {
      height: 44px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(var(--accent-rgb), .25);
      border-radius: 999px;
      background: var(--surface);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: var(--text);
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: transform .2s ease;
    }

    .lang-btn:active { transform: scale(.95); }
    .lang-btn svg { width: 20px; height: 20px; }

    .lang-menu {
      position: absolute;
      top: 52px;
      right: 0;
      width: 210px;
      max-height: min(70vh, 460px);
      overflow-y: auto;
      padding: 8px;
      border-radius: 24px;
      background: var(--bg);
      border: 1px solid rgba(var(--accent-rgb), .25);
      box-shadow: 0 8px 32px rgba(0, 0, 0, .45);
      animation: fadeUp .2s ease both;
    }

    .lang-menu[hidden] { display: none; }

    .lang-opt {
      display: block;
      width: 100%;
      padding: 11px 14px;
      border: 0;
      border-radius: 16px;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 15px;
      text-align: left;
      cursor: pointer;
    }

    .lang-opt.on {
      background: rgb(var(--accent-rgb));
      color: var(--on-accent);
    }

    /* ---------- appearance panel ---------- */
    .fab {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 6;
      width: 56px;
      height: 56px;
      border: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgb(var(--accent-rgb));
      color: var(--on-accent);
      box-shadow: 0 4px 16px rgba(0, 0, 0, .35);
      cursor: pointer;
      transition: transform .2s ease;
    }

    .fab:active { transform: scale(.92); }
    .fab svg { width: 26px; height: 26px; }

    .panel {
      position: fixed;
      right: 16px;
      bottom: 84px;
      z-index: 6;
      width: min(300px, calc(100vw - 32px));
      padding: 16px;
      border-radius: 28px;
      background: var(--bg);
      border: 1px solid rgba(var(--accent-rgb), .25);
      box-shadow: 0 8px 32px rgba(0, 0, 0, .45);
      animation: fadeUp .25s ease both;
    }

    .panel[hidden] { display: none; }

    .p-title {
      margin: 4px 0 10px;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text2);
    }

    .p-title:not(:first-child) { margin-top: 16px; }

    .opts {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .opt {
      border: 0;
      padding: 9px 14px;
      border-radius: 999px;
      background: var(--tile);
      color: var(--text);
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      transition: transform .2s ease;
    }

    .opt:active { transform: scale(.95); }

    .opt.on {
      background: rgb(var(--accent-rgb));
      color: var(--on-accent);
    }

    .swatches {
      display: flex;
      gap: 12px;
    }

    .sw {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid transparent;
      cursor: pointer;
      transition: transform .2s ease;
    }

    .sw:active { transform: scale(.9); }
    .sw.on { border-color: var(--text); }
    .sw[data-pick="purple"] { background: #D0BCFF; }
    .sw[data-pick="brown"]  { background: #E8BFA8; }
    .sw[data-pick="teal"]   { background: #9FD6CE; }
    .sw[data-pick="blue"]   { background: #AEC6FF; }

    @media (prefers-reduced-motion: reduce) {
      .card, .panel, .lang-menu, .gridlayer, .blob { animation: none; }
      .bubble, .shape { display: none; }
    }
  </style>
</head>
<body>
  <div class="bg" id="bg"></div>

  <div class="lang">
    <button class="lang-btn" id="langBtn" type="button" aria-label="Language" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm6.93 6h-2.95a15.65 15.65 0 0 0-1.38-3.56A8.03 8.03 0 0 1 18.92 8zM12 4.04c.83 1.2 1.48 2.53 1.91 3.96h-3.82c.43-1.43 1.08-2.76 1.91-3.96zM4.26 14C4.1 13.36 4 12.69 4 12s.1-1.36.26-2h3.38c-.08.66-.14 1.32-.14 2s.06 1.34.14 2H4.26zm.82 2h2.95c.32 1.25.78 2.45 1.38 3.56A7.987 7.987 0 0 1 5.08 16zm2.95-8H5.08a7.987 7.987 0 0 1 4.33-3.56A15.65 15.65 0 0 0 8.03 8zM12 19.96c-.83-1.2-1.48-2.53-1.91-3.96h3.82c-.43 1.43-1.08 2.76-1.91 3.96zM14.34 14H9.66c-.09-.66-.16-1.32-.16-2s.07-1.35.16-2h4.68c.09.65.16 1.32.16 2s-.07 1.34-.16 2zm.25 5.56c.6-1.11 1.06-2.31 1.38-3.56h2.95a8.03 8.03 0 0 1-4.33 3.56zM16.36 14c.08-.66.14-1.32.14-2s-.06-1.34-.14-2h3.38c.16.64.26 1.31.26 2s-.1 1.36-.26 2h-3.38z"/></svg>

  <button class="fab" id="fab" type="button" aria-label="Appearance" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12zm3-4C8.67 8 8 7.33 8 6.5S8.67 5 9.5 5s1.5.67 1.5 1.5S10.33 8 9.5 8zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 5 14.5 5s1.5.67 1.5 1.5S15.33 8 14.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 9 17.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
  </button>

  <div class="panel" id="panel" hidden>
    <p class="p-title" data-i18n="bg">background</p>
    <div class="opts" id="bgOpts">
      <button class="opt" type="button" data-mode="bubbles">bubbles</button>
      <button class="opt" type="button" data-mode="shapes">shapes</button>
      <button class="opt" type="button" data-mode="aurora">aurora</button>
      <button class="opt" type="button" data-mode="grid">grid</button>
      <button class="opt" type="button" data-mode="plain">plain</button>
    </div>

    <p class="p-title" data-i18n="color">color</p>
    <div class="swatches" id="themeOpts">
      <button class="sw" type="button" data-pick="purple" aria-label="purple"></button>
      <button class="sw" type="button" data-pick="brown" aria-label="brown"></button>
      <button class="sw" type="button" data-pick="teal" aria-label="teal"></button>
      <button class="sw" type="button" data-pick="blue" aria-label="blue"></button>
    </div>

  <script>
    /* ---------- small helpers ---------- */
    function pickRandom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function getLS(key) {
      try { return localStorage.getItem(key); } catch (e) { return null; }
    }

    function setLS(key, value) {
      try { localStorage.setItem(key, value); } catch (e) {}
    }

    function loadSetting(key, allowed, fallback) {
      var v = getLS(key);
      return v && allowed.indexOf(v) !== -1 ? v : fallback;
    }

    /* ---------- languages ---------- */
    var LANGS = ['en', 'ru', 'uz', 'tr', 'kk', 'ko', 'zh', 'es', 'de', 'fr'];

    var I18N = {
      en: { name: 'English',   code: 'EN', city: 'tashkent',  bg: 'background',   color: 'color',   modes: ['bubbles', 'shapes', 'aurora', 'grid', 'plain'] },
      ru: { name: 'Русский',   code: 'RU', city: 'ташкент',   bg: 'фон',          color: 'цвет',    modes: ['пузырьки', 'фигуры', 'аврора', 'сетка', 'без фона'] },
      uz: { name: 'Oʻzbekcha', code: 'UZ', city: 'toshkent',  bg: 'fon',          color: 'rang',    modes: ['pufakchalar', 'shakllar', 'shafaq', 'toʻr', 'fonsiz'] },
      tr: { name: 'Türkçe',    code: 'TR', city: 'taşkent',   bg: 'arka plan',    color: 'renk',    modes: ['baloncuklar', 'şekiller', 'aurora', 'ızgara', 'düz'] },
      kk: { name: 'Қазақша',   code: 'KK', city: 'ташкент',   bg: 'фон',          color: 'түс',     modes: ['көпіршіктер', 'пішіндер', 'аврора', 'тор', 'қарапайым'] },
      ko: { name: '한국어',     code: 'KO', city: '타슈켄트',   bg: '배경',         color: '색상',    modes: ['거품', '도형', '오로라', '격자', '단색'] },
      zh: { name: '中文',       code: 'ZH', city: '塔什干',     bg: '背景',         color: '颜色',    modes: ['气泡', '图形', '极光', '网格', '纯色'] },
      es: { name: 'Español',   code: 'ES', city: 'taskent',   bg: 'fondo',        color: 'color',   modes: ['burbujas', 'formas', 'aurora', 'cuadrícula', 'liso'] },
      de: { name: 'Deutsch',   code: 'DE', city: 'taschkent', bg: 'hintergrund',  color: 'farbe',   modes: ['blasen', 'formen', 'aurora', 'raster', 'schlicht'] },
      fr: { name: 'Français',  code: 'FR', city: 'tachkent',  bg: 'arrière-plan', color: 'couleur', modes: ['bulles', 'formes', 'aurore', 'grille', 'uni'] }
    };

    var lang = loadSetting('lang', LANGS, 'en');
    function T() { return I18N[lang]; }

    /* ---------- background modes ---------- */
    var MODES = ['bubbles', 'shapes', 'aurora', 'grid', 'plain'];
    var THEMES = ['purple', 'brown', 'teal', 'blue'];
    var bg = document.getElementById('bg');

    var SHAPES = [
      '<circle cx="12" cy="12" r="11"/>',
      '<rect x="2" y="2" width="20" height="20" rx="6"/>',
      '<polygon points="12,4 21,20 3,20" stroke-width="3"/>',
      '<polygon points="12,2 22,12 12,22 2,12" stroke-width="3"/>',
      '<path d="M12 1Q13.5 10.5 23 12Q13.5 13.5 12 23Q10.5 13.5 1 12Q10.5 10.5 12 1Z"/>',
      '<circle cx="12" cy="6.5" r="5"/><circle cx="12" cy="17.5" r="5"/><circle cx="6.5" cy="12" r="5"/><circle cx="17.5" cy="12" r="5"/>',
      '<circle cx="12" cy="12" r="8.5" fill="none" stroke-width="3"/>',
      '<rect x="1" y="7" width="22" height="10" rx="5"/>',
      '<polygon points="12,2 21,7 21,17 12,22 3,17 3,7" stroke-width="3"/>'
    ];

    function makeShape() {
      var el = document.createElement('span');
      var size = 28 + Math.random() * 56;
      var dur = 14 + Math.random() * 14;
      var dir = Math.random() < 0.5 ? -1 : 1;
      el.className = 'shape';
      el.style.width = el.style.height = size + 'px';
      el.style.left = Math.random() * 100 + '%';
      el.style.animationDuration = dur + 's';
      el.style.animationDelay = (-Math.random() * dur) + 's';
      el.style.setProperty('--drift', (Math.random() * 120 - 60) + 'px');
      el.style.setProperty('--o', (0.14 + Math.random() * 0.2).toFixed(2));
      el.style.setProperty('--dur', (10 + Math.random() * 14) + 's');
      el.style.setProperty('--turn', dir * (180 + Math.random() * 360) + 'deg');
      el.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" '
        + 'stroke-linejoin="round" stroke-width="1">' + pickRandom(SHAPES) + '</svg>';
      return el;
    }

    function makeBubble() {
      var el = document.createElement('span');
      var size = 20 + Math.random() * 70;
      el.className = 'bubble';
      el.style.width = el.style.height = size + 'px';
      el.style.left = Math.random() * 100 + '%';
      el.style.animationDuration = (9 + Math.random() * 10) + 's';
      el.style.animationDelay = (-Math.random() * 18) + 's';
      el.style.setProperty('--drift', (Math.random() * 80 - 40) + 'px');
      return el;
    }

    function addEl(cls) {
      var el = document.createElement('span');
      el.className = cls;
      bg.appendChild(el);
    }

    function renderBg(mode) {
      bg.innerHTML = '';
      var i;
      if (mode === 'shapes') {
        for (i = 0; i < 16; i++) bg.appendChild(makeShape());
      } else if (mode === 'bubbles') {
        for (i = 0; i < 18; i++) bg.appendChild(makeBubble());
      } else if (mode === 'aurora') {
        addEl('blob b1'); addEl('blob b2'); addEl('blob b3');
      } else if (mode === 'grid') {
        addEl('gridlayer');
      }
    }

    /* ---------- elements ---------- */
    var fab = document.getElementById('fab');
    var panel = document.getElementById('panel');
    var bgOpts = document.getElementById('bgOpts');
    var themeOpts = document.getElementById('themeOpts');
    var themeColor = document.getElementById('themeColor');
    var langBtn = document.getElementById('langBtn');
    var langMenu = document.getElementById('langMenu');
    var langCode = document.getElementById('langCode');

    /* ---------- appearance panel ---------- */
    function markActive(container, attr, value) {
      container.querySelectorAll('[' + attr + ']').forEach(function (b) {
        b.classList.toggle('on', b.getAttribute(attr) === value);
      });
    }

    function setMode(mode) {
      renderBg(mode);
      markActive(bgOpts, 'data-mode', mode);
      setLS('bgmode', mode);
    }

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      markActive(themeOpts, 'data-pick', theme);
      setLS('theme', theme);
      var c = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
      if (c) themeColor.setAttribute('content', c);
    }

    function closeMenus() {
      panel.hidden = true;
      fab.setAttribute('aria-expanded', 'false');
      langMenu.hidden = true;
      langBtn.setAttribute('aria-expanded', 'false');
    }

    fab.addEventListener('click', function (e) {
      e.stopPropagation();
      var willOpen = panel.hidden;
      closeMenus();
      panel.hidden = !willOpen;
      fab.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
    });

    panel.addEventListener('click', function (e) { e.stopPropagation(); });

    bgOpts.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-mode]');
      if (btn) setMode(btn.getAttribute('data-mode'));
    });

    themeOpts.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-pick]');
      if (btn) setTheme(btn.getAttribute('data-pick'));
    });

    /* ---------- language menu ---------- */
    function buildLangMenu() {
      langMenu.innerHTML = '';
      LANGS.forEach(function (code) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'lang-opt' + (code === lang ? ' on' : '');
        b.setAttribute('data-lang', code);
        b.textContent = I18N[code].name;
        langMenu.appendChild(b);
      });
    }

    langBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      var willOpen = langMenu.hidden;
      closeMenus();
      langMenu.hidden = !willOpen;
      langBtn.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
    });

    langMenu.addEventListener('click', function (e) {
      e.stopPropagation();
      var btn = e.target.closest('[data-lang]');
      if (!btn) return;
      lang = btn.getAttribute('data-lang');
      setLS('lang', lang);
      closeMenus();
      buildLangMenu();
      applyLang();
    });

    document.addEventListener('click', closeMenus);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeMenus();
    });

    /* ---------- apply language to the whole page ---------- */
    function applyLang() {
      var d = T();
      document.documentElement.lang = lang;
      langCode.textContent = d.code;

      document.querySelectorAll('[data-i18n]').forEach(function (el) {
        var v = d[el.getAttribute('data-i18n')];
        if (typeof v === 'string') el.textContent = v;
      });

      bgOpts.querySelectorAll('[data-mode]').forEach(function (b) {
        b.textContent = d.modes[MODES.indexOf(b.getAttribute('data-mode'))];
      });
    }

    /* ---------- start ---------- */
    setTheme(loadSetting('theme', THEMES, 'purple'));
    setMode(loadSetting('bgmode', MODES, 'bubbles'));
    buildLangMenu();
    applyLang();
  </script>
</body>
</html>
