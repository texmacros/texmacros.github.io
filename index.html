<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1E1230" id="themeColor">
  <title>texmacros</title>
  <style>
    /* ---------- color themes ---------- */
    :root {
      --accent-rgb: 208,188,255;
      --bg: #1E1230;
      --surface: rgba(43, 27, 61, .85);
      --surface2: #4A3A63;
      --tile: rgba(74, 58, 99, .55);
      --text: #EADDFF;
      --text2: #CCC2DC;
      --on-accent: #381E72;
      --up: #B5E2BE;
      --down: #F9B8B4;
    }

    html[data-theme="brown"] {
      --accent-rgb: 232,191,168;
      --bg: #1F140F;
      --surface: rgba(52, 35, 27, .88);
      --surface2: #5A4034;
      --tile: rgba(90, 64, 52, .55);
      --text: #FBE5DA;
      --text2: #D8C2B8;
      --on-accent: #3F2517;
    }

    html[data-theme="teal"] {
      --accent-rgb: 159,214,206;
      --bg: #0E1D1B;
      --surface: rgba(23, 45, 42, .88);
      --surface2: #2F4F4A;
      --tile: rgba(47, 79, 74, .55);
      --text: #D6F2EE;
      --text2: #B2CCC8;
      --on-accent: #00372F;
    }

    html[data-theme="blue"] {
      --accent-rgb: 174,198,255;
      --bg: #0F1829;
      --surface: rgba(24, 36, 64, .88);
      --surface2: #33466E;
      --tile: rgba(51, 70, 110, .55);
      --text: #DCE6FF;
      --text2: #B9C6E4;
      --on-accent: #0B2A63;
    }

    * { box-sizing: border-box; margin: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 76px 20px 88px;
      background: var(--bg);
      font-family: Roboto, Arial, sans-serif;
      color: var(--text2);
      overflow-x: hidden;
      transition: background .4s ease;
    }

    /* ---------- animated background ---------- */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .bubble {
      position: absolute;
      bottom: -140px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(var(--accent-rgb), .35), rgba(var(--accent-rgb), .06));
      border: 1px solid rgba(var(--accent-rgb), .25);
      animation: rise linear infinite;
    }

    @keyframes rise {
      0%   { transform: translate(0, 0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translate(var(--drift), calc(-100vh - 280px)); opacity: 0; }
    }

    .shape {
      position: absolute;
      bottom: -120px;
      color: rgb(var(--accent-rgb));
      opacity: 0;
      animation: float linear infinite;
    }

    .shape svg {
      display: block;
      width: 100%;
      height: 100%;
      animation: turn var(--dur, 20s) linear infinite;
    }

    @keyframes float {
      0%   { transform: translate(0, 0); opacity: 0; }
      10%  { opacity: var(--o, .2); }
      90%  { opacity: var(--o, .2); }
      100% { transform: translate(var(--drift), calc(-100vh - 240px)); opacity: 0; }
    }

    @keyframes turn {
      to { transform: rotate(var(--turn, 360deg)); }
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      will-change: transform;
    }

    .blob.b1 {
      width: 70vmax; height: 70vmax;
      left: -20vmax; top: -20vmax;
      background: rgba(var(--accent-rgb), .22);
      animation: drift1 22s ease-in-out infinite alternate;
    }

    .blob.b2 {
      width: 60vmax; height: 60vmax;
      right: -22vmax; top: 25vh;
      background: var(--surface2);
      opacity: .6;
      animation: drift2 26s ease-in-out infinite alternate;
    }

    .blob.b3 {
      width: 55vmax; height: 55vmax;
      left: 8vmax; bottom: -28vmax;
      background: rgba(var(--accent-rgb), .15);
      animation: drift3 30s ease-in-out infinite alternate;
    }

    @keyframes drift1 { to { transform: translate(18vmax, 12vmax) scale(1.15); } }
    @keyframes drift2 { to { transform: translate(-16vmax, -10vmax) scale(1.1); } }
    @keyframes drift3 { to { transform: translate(14vmax, -14vmax) scale(1.2); } }

    .gridlayer {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(var(--accent-rgb), .32) 1.2px, transparent 1.6px);
      background-size: 26px 26px;
      -webkit-mask-image: radial-gradient(ellipse at 50% 40%, #000 25%, transparent 78%);
      mask-image: radial-gradient(ellipse at 50% 40%, #000 25%, transparent 78%);
      animation: gridmove 40s linear infinite;
    }

    @keyframes gridmove {
      to { background-position: 26px 26px; }
    }

    /* ---------- card ---------- */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      padding: 40px 24px 40px;
      text-align: center;
      background: var(--surface);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 32px;
      animation: fadeUp .8s ease both;
      transition: background .4s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      display: block;
      width: 112px;
      height: 112px;
      margin: 0 auto 20px;
      object-fit: cover;
      border-radius: 36%;
      border: 3px solid var(--surface2);
      background: var(--surface2);
    }

    h1 { font-size: 34px; color: var(--text); }
    .meta { margin-top: 8px; font-size: 18px; }

    /* ---------- tiles ---------- */
    .info {
      margin-top: 28px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .tile {
      display: block;
      width: 100%;
      padding: 16px 18px;
      border-radius: 24px;
      background: var(--tile);
      color: var(--text);
      text-align: left;
      transition: background .4s ease, transform .2s ease;
    }

    button.tile {
      border: 0;
      font: inherit;
      cursor: pointer;
    }

    button.tile:active { transform: scale(.98); }

    .tile .label {
      font-size: 12px;
      letter-spacing: .04em;
      color: var(--text2);
    }

    .clock {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .c-left { min-width: 0; }

    .time {
      margin-top: 6px;
      font-size: 36px;
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .date {
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text2);
    }

    .date svg { width: 16px; height: 16px; flex: none; }

    .c-right {
      min-width: 0;
      text-align: right;
    }

    .w-val {
      font-size: 26px;
      font-weight: 700;
      line-height: 1.1;
      white-space: nowrap;
    }

    .w-sub {
      margin-top: 8px;
      font-size: 12px;
      color: var(--text2);
    }

    .conv .row {
      margin-top: 10px;
      display: flex;
      gap: 10px;
    }

    .field {
      min-width: 0;
      height: 44px;
      padding: 0 14px;
      border: 0;
      border-radius: 16px;
      background: rgba(0, 0, 0, .22);
      color: var(--text);
      font: inherit;
      font-size: 15px;
    }

    .field:focus {
      outline: 2px solid rgba(var(--accent-rgb), .7);
      outline-offset: 0;
    }

    select.field {
      flex: 1;
      appearance: none;
      -webkit-appearance: none;
      padding-right: 34px;
      text-overflow: ellipsis;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><path fill='%23CCC2DC' d='M7 10l5 5 5-5z'/></svg>");
      background-repeat: no-repeat;
      background-position: right 8px center;
      background-color: rgba(0, 0, 0, .22);
    }

    select.field option {
      background: var(--bg);
      color: var(--text);
    }

    input.field {
      width: 108px;
      text-align: right;
    }

    .value {
      margin-top: 12px;
      font-size: clamp(20px, 6vw, 28px);
      font-weight: 700;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-variant-numeric: tabular-nums;
    }

    .value .unit {
      font-size: 14px;
      font-weight: 500;
      color: var(--text2);
    }

    .tile .sub {
      margin-top: 8px;
      font-size: 12px;
      color: var(--text2);
    }

    .up   { color: var(--up); }
    .down { color: var(--down); }

    /* ---------- contacts ---------- */
    .links {
      margin-top: 28px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 24px;
      border-radius: 999px;
      background: var(--surface2);
      color: var(--text);
      text-decoration: none;
      font-size: 16px;
      transition: transform .2s ease, background .4s ease;
    }

    .btn:active { transform: scale(.96); }
    .btn.primary { background: rgb(var(--accent-rgb)); color: var(--on-accent); }

    .split {
      display: inline-flex;
      align-items: stretch;
      max-width: 100%;
      padding: 0;
      gap: 0;
      overflow: hidden;
    }

    .split:active { transform: none; }

    .seg {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      color: inherit;
      font: inherit;
      font-size: 16px;
      text-decoration: none;
      background: transparent;
      border: 0;
      cursor: pointer;
      transition: background .2s ease;
    }

    .seg:active { background: rgba(255, 255, 255, .1); }

    .seg.main {
      min-width: 0;
      padding-left: 24px;
    }

    .seg.save {
      flex: none;
      gap: 6px;
      padding-right: 20px;
      border-left: 1px solid rgba(255, 255, 255, .18);
      font-size: 14px;
    }

    .seg svg { flex: none; }

    @media (max-width: 380px) {
      .seg.save .lbl { display: none; }
      .seg.save { padding: 14px 16px; }
    }

    /* ---------- language button ---------- */
    .lang {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top, 0px));
      right: 14px;
      z-index: 7;
    }

    .lang-btn {
      height: 44px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(var(--accent-rgb), .25);
      border-radius: 999px;
      background: var(--surface);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: var(--text);
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: transform .2s ease;
    }

    .lang-btn:active { transform: scale(.95); }
    .lang-btn svg { width: 20px; height: 20px; }

    .lang-menu {
      position: absolute;
      top: 52px;
      right: 0;
      width: 210px;
      max-height: min(70vh, 460px);
      overflow-y: auto;
      padding: 8px;
      border-radius: 24px;
      background: var(--bg);
      border: 1px solid rgba(var(--accent-rgb), .25);
      box-shadow: 0 8px 32px rgba(0, 0, 0, .45);
      animation: fadeUp .2s ease both;
    }

    .lang-menu[hidden] { display: none; }

    .lang-opt {
      display: block;
      width: 100%;
      padding: 11px 14px;
      border: 0;
      border-radius: 16px;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 15px;
      text-align: left;
      cursor: pointer;
    }

    .lang-opt.on {
      background: rgb(var(--accent-rgb));
      color: var(--on-accent);
    }

    /* ---------- calendar ---------- */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 9;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(18, 10, 28, .7);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .overlay[hidden] { display: none; }

    .cal {
      width: 100%;
      max-width: 340px;
      padding: 16px;
      border-radius: 28px;
      background: var(--bg);
      border: 1px solid rgba(var(--accent-rgb), .25);
      box-shadow: 0 8px 32px rgba(0, 0, 0, .45);
      animation: fadeUp .25s ease both;
    }

    .cal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }

    .cal-title {
      flex: 1;
      text-align: center;
      font-size: 16px;
      font-weight: 500;
      color: var(--text);
      text-transform: capitalize;
    }

    .cal-nav {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--tile);
      color: var(--text);
      cursor: pointer;
    }

    .cal-nav:active { transform: scale(.92); }
    .cal-nav svg { width: 20px; height: 20px; }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
    }

    .dow {
      padding-bottom: 4px;
      font-size: 12px;
      color: var(--text2);
    }

    .d {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 14px;
      color: var(--text);
    }

    .d.today {
      background: rgb(var(--accent-rgb));
      color: var(--on-accent);
      font-weight: 700;
    }

    /* ---------- appearance panel ---------- */
    .fab {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 6;
      width: 56px;
      height: 56px;
      border: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgb(var(--accent-rgb));
      color: var(--on-accent);
      box-shadow: 0 4px 16px rgba(0, 0, 0, .35);
      cursor: pointer;
      transition: transform .2s ease;
    }

    .fab:active { transform: scale(.92); }
    .fab svg { width: 26px; height: 26px; }

    .panel {
      position: fixed;
      right: 16px;
      bottom: 84px;
      z-index: 6;
      width: min(300px, calc(100vw - 32px));
      padding: 16px;
      border-radius: 28px;
      background: var(--bg);
      border: 1px solid rgba(var(--accent-rgb), .25);
      box-shadow: 0 8px 32px rgba(0, 0, 0, .45);
      animation: fadeUp .25s ease both;
    }

    .panel[hidden] { display: none; }

    .p-title {
      margin: 4px 0 10px;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text2);
    }

    .p-title:not(:first-child) { margin-top: 16px; }

    .opts {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .opt {
      border: 0;
      padding: 9px 14px;
      border-radius: 999px;
      background: var(--tile);
      color: var(--text);
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      transition: transform .2s ease;
    }

    .opt:active { transform: scale(.95); }

    .opt.on {
      background: rgb(var(--accent-rgb));
      color: var(--on-accent);
    }

    .swatches {
      display: flex;
      gap: 12px;
    }

    .sw {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid transparent;
      cursor: pointer;
      transition: transform .2s ease;
    }

    .sw:active { transform: scale(.9); }
    .sw.on { border-color: var(--text); }
    .sw[data-pick="purple"] { background: #D0BCFF; }
    .sw[data-pick="brown"]  { background: #E8BFA8; }
    .sw[data-pick="teal"]   { background: #9FD6CE; }
    .sw[data-pick="blue"]   { background: #AEC6FF; }

    @media (prefers-reduced-motion: reduce) {
      .card, .panel, .cal, .lang-menu, .gridlayer, .blob { animation: none; }
      .bubble, .shape { display: none; }
    }
  </style>
</head>
<body>
  <div class="bg" id="bg"></div>

  <div class="lang">
    <button class="lang-btn" id="langBtn" type="button" aria-label="Language" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm6.93 6h-2.95a15.65 15.65 0 0 0-1.38-3.56A8.03 8.03 0 0 1 18.92 8zM12 4.04c.83 1.2 1.48 2.53 1.91 3.96h-3.82c.43-1.43 1.08-2.76 1.91-3.96zM4.26 14C4.1 13.36 4 12.69 4 12s.1-1.36.26-2h3.38c-.08.66-.14 1.32-.14 2s.06 1.34.14 2H4.26zm.82 2h2.95c.32 1.25.78 2.45 1.38 3.56A7.987 7.987 0 0 1 5.08 16zm2.95-8H5.08a7.987 7.987 0 0 1 4.33-3.56A15.65 15.65 0 0 0 8.03 8zM12 19.96c-.83-1.2-1.48-2.53-1.91-3.96h3.82c-.43 1.43-1.08 2.76-1.91 3.96zM14.34 14H9.66c-.09-.66-.16-1.32-.16-2s.07-1.35.16-2h4.68c.09.65.16 1.32.16 2s-.07 1.34-.16 2zm.25 5.56c.6-1.11 1.06-2.31 1.38-3.56h2.95a8.03 8.03 0 0 1-4.33 3.56zM16.36 14c.08-.66.14-1.32.14-2s-.06-1.34-.14-2h3.38c.16.64.26 1.31.26 2s-.1 1.36-.26 2h-3.38z"/></svg>
      <span id="langCode">EN</span>
    </button>
    <div class="lang-menu" id="langMenu" hidden></div>
  </div>

  <main class="card">
    <img class="avatar" src="avatar.jpg" alt="texmacros"
         onerror="this.onerror=null;this.src='https://github.com/texmacros.png'">
    <h1>texmacros</h1>
    <p class="meta">13.10.2005 · <span data-i18n="city">tashkent</span></p>

    <div class="info">
      <button class="tile clock" id="clockTile" type="button" aria-label="Calendar">
        <div class="c-left">
          <div class="label" data-i18n="city">tashkent</div>

        texmacros@gmail.com

      <div class="btn split">
        <a class="seg main" href="tel:+998338696969">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
          +998 33 869 69 69
        </a>

    function makeShape() {
      var el = document.createElement('span');
      var size = 28 + Math.random() * 56;
      var dur = 14 + Math.random() * 14;
      var dir = Math.random() < 0.5 ? -1 : 1;
      el.className = 'shape';
      el.style.width = el.style.height = size + 'px';
      el.style.left = Math.random() * 100 + '%';
      el.style.animationDuration = dur + 's';
      el.style.animationDelay = (-Math.random() * dur) + 's';
      el.style.setProperty('--drift', (Math.random() * 120 - 60) + 'px');
      el.style.setProperty('--o', (0.14 + Math.random() * 0.2).toFixed(2));
      el.style.setProperty('--dur', (10 + Math.random() * 14) + 's');
      el.style.setProperty('--turn', dir * (180 + Math.random() * 360) + 'deg');
      el.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" '
        + 'stroke-linejoin="round" stroke-width="1">' + pickRandom(SHAPES) + '</svg>';
      return el;
    }

    function makeBubble() {
      var el = document.createElement('span');
      var size = 20 + Math.random() * 70;
      el.className = 'bubble';
      el.style.width = el.style.height = size + 'px';
      el.style.left = Math.random() * 100 + '%';
      el.style.animationDuration = (9 + Math.random() * 10) + 's';
      el.style.animationDelay = (-Math.random() * 18) + 's';
      el.style.setProperty('--drift', (Math.random() * 80 - 40) + 'px');
      return el;
    }

    function addEl(cls) {
      var el = document.createElement('span');
      el.className = cls;
      bg.appendChild(el);
    }

    function renderBg(mode) {
      bg.innerHTML = '';
      var i;
      if (mode === 'shapes') {
        for (i = 0; i < 16; i++) bg.appendChild(makeShape());
      } else if (mode === 'bubbles') {
        for (i = 0; i < 18; i++) bg.appendChild(makeBubble());
      } else if (mode === 'aurora') {
        addEl('blob b1'); addEl('blob b2'); addEl('blob b3');
      } else if (mode === 'grid') {
        addEl('gridlayer');
      }
    }

    /* ---------- appearance panel ---------- */
    function markActive(container, attr, value) {
      container.querySelectorAll('[' + attr + ']').forEach(function (b) {
        b.classList.toggle('on', b.getAttribute(attr) === value);
      });
    }

    function setMode(mode) {
      renderBg(mode);
      markActive(bgOpts, 'data-mode', mode);
      setLS('bgmode', mode);
    }

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      markActive(themeOpts, 'data-pick', theme);
      setLS('theme', theme);
      var c = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
      if (c) themeColor.setAttribute('content', c);
    }

    function closeMenus() {
      panel.hidden = true;
      fab.setAttribute('aria-expanded', 'false');
      langMenu.hidden = true;
      langBtn.setAttribute('aria-expanded', 'false');
    }

    fab.addEventListener('click', function (e) {
      e.stopPropagation();
      var willOpen = panel.hidden;
      closeMenus();
      panel.hidden = !willOpen;
      fab.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
    });

    panel.addEventListener('click', function (e) { e.stopPropagation(); });

    bgOpts.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-mode]');
      if (btn) setMode(btn.getAttribute('data-mode'));
    });

      var btn = e.target.closest('[data-pick]');
      if (btn) setTheme(btn.getAttribute('data-pick'));
    });

    /* ---------- language menu ---------- */
    function buildLangMenu() {
      langMenu.innerHTML = '';
      LANGS.forEach(function (code) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'lang-opt' + (code === lang ? ' on' : '');
        b.setAttribute('data-lang', code);
        b.textContent = I18N[code].name;
        langMenu.appendChild(b);
      });

      langMenu.hidden = !willOpen;

      e.stopPropagation();

      if (!btn) return;
      lang = btn.getAttribute('data-lang');

      closeMenus();
      buildLangMenu();
      applyLang();

    document.addEventListener('click', closeMenus);

    /* ---------- clock + calendar ---------- */
    var timeFmt, dateFmt;

    function buildFormatters() {
      var loc = T().loc;
      timeFmt = new Intl.DateTimeFormat(loc, { timeZone: TZ, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
      dateFmt = new Intl.DateTimeFormat(loc, { timeZone: TZ, weekday: 'short', day: 'numeric', month: 'short' });
    }

    function renderClock() {
      var now = new Date();
      tTime.textContent = timeFmt.format(now);
      tDate.textContent = dateFmt.format(now);
    }

    function tzToday() {
      var parts = new Intl.DateTimeFormat('en-CA', {
        timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit'
      }).formatToParts(new Date());
      var o = {};
      parts.forEach(function (p) { o[p.type] = p.value; });
      return { y: +o.year, m: +o.month - 1, d: +o.day };
    }

    var calY = 0, calM = 0;

    function renderCal() {
      var loc = T().loc;
      var today = tzToday();

      calTitle.textContent = new Intl.DateTimeFormat(loc, {
        month: 'long', year: 'numeric', timeZone: 'UTC'
      }).format(new Date(Date.UTC(calY, calM, 1)));

      var dowFmt = new Intl.DateTimeFormat(loc, { weekday: 'short', timeZone: 'UTC' });
      var html = '';
      var i;
      for (i = 0; i < 7; i++) {
        html += '<div class="dow">' + dowFmt.format(new Date(Date.UTC(2024, 0, 1 + i))) + '</div>';
      }

      var first = (new Date(Date.UTC(calY, calM, 1)).getUTCDay() + 6) % 7;
      var days = new Date(Date.UTC(calY, calM + 1, 0)).getUTCDate();
      for (i = 0; i < first; i++) html += '<div></div>';
      for (i = 1; i <= days; i++) {
        var isToday = calY === today.y && calM === today.m && i === today.d;
        html += '<div class="d' + (isToday ? ' today' : '') + '">' + i + '</div>';
      }
      calGrid.innerHTML = html;
    }

    function openCal() {
      var today = tzToday();
      calY = today.y;
      calM = today.m;
      closeMenus();
      renderCal();
      calOverlay.hidden = false;
    }

    function closeCal() { calOverlay.hidden = true; }

    function shiftMonth(delta) {
      calM += delta;
      if (calM < 0) { calM = 11; calY--; }
      if (calM > 11) { calM = 0; calY++; }
      renderCal();
    }

    clockTile.addEventListener('click', function (e) {
      e.stopPropagation();
      openCal();
    });

    document.getElementById('calPrev').addEventListener('click', function () { shiftMonth(-1); });
    document.getElementById('calNext').addEventListener('click', function () { shiftMonth(1); });
    calOverlay.addEventListener('click', function (e) {
      if (e.target === calOverlay) closeCal();

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { closeMenus(); closeCal(); }
    });

    setInterval(renderClock, 1000);

    /* ---------- weather: Open-Meteo ---------- */
    var wState = 'loading';
    var wData = null;

    function describe(code, isDay) {
      if (code === 0) return [0, isDay ? '\u2600\uFE0F' : '\uD83C\uDF19'];
      if (code === 1) return [1, isDay ? '\uD83C\uDF24\uFE0F' : '\uD83C\uDF19'];
      if (code === 2) return [2, '\u26C5'];
      if (code === 3) return [3, '\u2601\uFE0F'];
      if (code === 45 || code === 48) return [4, '\uD83C\uDF2B\uFE0F'];
      if (code >= 51 && code <= 57) return [5, '\uD83C\uDF26\uFE0F'];
      if (code >= 61 && code <= 67) return [6, '\uD83C\uDF27\uFE0F'];
      if (code >= 71 && code <= 77) return [7, '\u2744\uFE0F'];
      if (code >= 80 && code <= 82) return [8, '\uD83C\uDF26\uFE0F'];
      if (code === 85 || code === 86) return [9, '\uD83C\uDF28\uFE0F'];
      if (code >= 95) return [10, '\u26C8\uFE0F'];
      return [11, '\uD83C\uDF21\uFE0F'];
    }

    function renderWeather() {
      var d = T();
      if (wState === 'ok' && wData) {
        var x = describe(wData.code, wData.isDay);
        wValue.textContent = x[1] + ' ' + Math.round(wData.temp) + '\u00B0';
        wSub.textContent = d.wx[x[0]] + ' \u00B7 ' + d.feels + ' ' + Math.round(wData.feels) + '\u00B0';
      } else if (wState === 'na') {
        wValue.textContent = '\u2014';
        wSub.textContent = d.na;
      } else {
        wValue.textContent = '\u2026';
        wSub.textContent = d.loading;
      }
    }

    function loadWeather() {
      var url = 'https://api.open-meteo.com/v1/forecast'
        + '?latitude=41.2995&longitude=69.2401'
        + '&current=temperature_2m,apparent_temperature,weather_code,is_day'
        + '&timezone=Asia%2FTashkent';
      fetchJson(url, 8000).then(function (j) {
        var c = j.current;
        wData = {
          code: c.weather_code,
          isDay: c.is_day,
          temp: c.temperature_2m,
          feels: c.apparent_temperature
        };
        wState = 'ok';
        renderWeather();
      }).catch(function () {
        if (wState !== 'ok') {
          wState = 'na';
          renderWeather();
        }
      });
    }

    /* ---------- converter: Central Bank of Uzbekistan ---------- */
    var CBU_ALL = 'https://cbu.uz/ru/arkhiv-kursov-valyut/json/';
    var PINNED = ['USD', 'EUR', 'RUB', 'KZT', 'CNY', 'TRY', 'GBP', 'KRW', 'JPY', 'AED'];
    var rates = null;
    var rState = 'loading';

    function dateValue(s) {
      var p = String(s).split('.');
      return new Date(+p[2], +p[1] - 1, +p[0]).getTime() || 0;
    }

    function reduceRates(data) {
      var best = {};
      data.forEach(function (x) {
        if (!x || !x.Ccy || !parseFloat(x.Rate)) return;
        var prev = best[x.Ccy];
        if (!prev || dateValue(x.Date) > dateValue(prev.Date)) {
          best[x.Ccy] = { Ccy: x.Ccy, Rate: x.Rate, Diff: x.Diff, Date: x.Date, Nominal: x.Nominal };
        }
      });
      return Object.keys(best).map(function (k) { return best[k]; });
    }

    function currencyName(code) {
      try {
        var n = new Intl.DisplayNames([T().loc], { type: 'currency' }).of(code);
        return n && n !== code ? n : '';
      } catch (e) {
        return '';
      }
    }

    function buildSelect() {
      if (!rates) return;
      var current = curSel.value || getLS('cur') || 'USD';
      var codes = rates.list.map(function (x) { return x.Ccy; });
      var pinned = PINNED.filter(function (c) { return codes.indexOf(c) !== -1; });
      var rest = codes.filter(function (c) { return pinned.indexOf(c) === -1; }).sort();

      curSel.innerHTML = '';

      function add(code) {
        var o = document.createElement('option');
        var n = currencyName(code);
        o.value = code;
        o.textContent = n ? code + ' \u2014 ' + n : code;
        curSel.appendChild(o);
      }

      pinned.forEach(add);
      if (pinned.length && rest.length) {
        var sep = document.createElement('option');
        sep.disabled = true;
        sep.textContent = '\u2500\u2500\u2500\u2500\u2500\u2500';
        curSel.appendChild(sep);
      }
      rest.forEach(add);

      if (codes.indexOf(current) !== -1) curSel.value = current;
      else curSel.value = codes.indexOf('USD') !== -1 ? 'USD' : codes[0];
    }

    function parseAmount(s) {
      var n = parseFloat(String(s).replace(/\s/g, '').replace(',', '.'));
      return isFinite(n) && n >= 0 ? n : 0;
    }

    function formatResult(n) {
      var digits = n >= 1e6 ? 0 : 2;
      return new Intl.NumberFormat(T().loc, {
        minimumFractionDigits: digits,
        maximumFractionDigits: digits
      }).format(n);
    }

    function renderConv() {
      var d = T();
      if (!rates) {
        rNum.textContent = rState === 'na' ? '\u2014' : '\u2026';
        rUnit.textContent = '';
        rDiff.textContent = '';
        rDate.textContent = rState === 'na' ? d.na : d.loading;
        return;
      }

      var item = null;
      rates.list.forEach(function (x) { if (x.Ccy === curSel.value) item = x; });
      if (!item) return;

      var perUnit = parseFloat(item.Rate) / (parseFloat(item.Nominal) || 1);
      rNum.textContent = formatResult(parseAmount(amt.value) * perUnit);
      rUnit.textContent = ' UZS';

      var diff = parseFloat(item.Diff);
      rDiff.className = '';
      rDiff.textContent = '';
      if (diff > 0) {
        rDiff.className = 'up';
        rDiff.textContent = '\u25B2 ' + diff.toFixed(2) + ' \u00B7 ';
      } else if (diff < 0) {
        rDiff.className = 'down';
        rDiff.textContent = '\u25BC ' + Math.abs(diff).toFixed(2) + ' \u00B7 ';
      }
      rDate.textContent = item.Date + (rates.saved ? ' \u00B7 ' + d.cached : '');
    }

    curSel.addEventListener('change', function () {
      setLS('cur', curSel.value);
      renderConv();
    });

    amt.addEventListener('input', function () {
      setLS('amt', amt.value);
      renderConv();
    });

    function loadRates() {
      var cached = null;
      try { cached = JSON.parse(getLS('cbu_all')); } catch (e) {}
      if (cached && cached.length) {
        rates = { list: cached, saved: true };
        rState = 'ok';
        buildSelect();
        renderConv();
      }

      fetchJson(CBU_ALL, 8000).then(function (data) {
        var list = reduceRates(Array.isArray(data) ? data : []);
        if (!list.length) throw new Error('empty');
        rates = { list: list, saved: false };
        rState = 'ok';
        setLS('cbu_all', JSON.stringify(list));
        buildSelect();
        renderConv();
      }).catch(function () {
        if (!rates) {
          rState = 'na';
          renderConv();
        }
      });
    }

    /* ---------- save contact (.vcf) ---------- */
    function saveContact() {
      var vcf = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        'N:texmacros;;;;',
        'FN:texmacros',
        'TEL;TYPE=CELL:+998338696969',
        'EMAIL;TYPE=INTERNET:texmacros@gmail.com',
        'URL:https://texmacros.github.io',
        'URL:https://t.me/texmac',
        'END:VCARD'
      ].join('\r\n');

      try {
        var blob = new Blob([vcf], { type: 'text/vcard;charset=utf-8' });
        var href = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = href;
        a.download = 'texmacros.vcf';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(href); }, 3000);
      } catch (e) {
        window.location.href = 'data:text/vcard;charset=utf-8,' + encodeURIComponent(vcf);
      }

      saveLbl.textContent = '\u2713 ' + T().saved;
      setTimeout(function () { saveLbl.textContent = T().save; }, 2000);
    }

    saveBtn.addEventListener('click', saveContact);

    /* ---------- apply language to the whole page ---------- */
    function applyLang() {
      var d = T();
      document.documentElement.lang = lang;
      langCode.textContent = d.code;

      document.querySelectorAll('[data-i18n]').forEach(function (el) {
        var v = d[el.getAttribute('data-i18n')];
        if (typeof v === 'string') el.textContent = v;
      });

      bgOpts.querySelectorAll('[data-mode]').forEach(function (b) {
        b.textContent = d.modes[MODES.indexOf(b.getAttribute('data-mode'))];
      });

      saveLbl.textContent = d.save;

      buildFormatters();
      renderClock();
      renderWeather();
      buildSelect();
      renderConv();
      if (!calOverlay.hidden) renderCal();
    }

    /* ---------- start ---------- */
    var savedAmt = getLS('amt');
    if (savedAmt !== null) amt.value = savedAmt;

    setTheme(loadSetting('theme', THEMES, 'purple'));
    setMode(loadSetting('bgmode', MODES, 'bubbles'));
    buildLangMenu();
    applyLang();
    loadWeather();
    setInterval(loadWeather, 15 * 60 * 1000);
    loadRates();
  </script>
</body>
</html>
