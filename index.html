<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>texmacros</title>
  <style>
    * { box-sizing: border-box; margin: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 20px;
      background: #1E1230;
      font-family: Roboto, Arial, sans-serif;
      color: #CCC2DC;
      overflow-x: hidden;
    }

    .bubbles {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .bubble {
      position: absolute;
      bottom: -140px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(208,188,255,.35), rgba(208,188,255,.06));
      border: 1px solid rgba(208,188,255,.25);
      animation: rise linear infinite;
    }

    @keyframes rise {
      0%   { transform: translate(0, 0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translate(var(--drift), calc(-100vh - 280px)); opacity: 0; }
    }

    /* ---------- плеер ---------- */
    .player {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 12px;
      background: rgba(43, 27, 61, .85);
      backdrop-filter: blur(6px);
      border-radius: 999px;
      animation: fadeUp .8s ease both;
    }

    .play-btn {
      flex: none;
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 50%;
      background: #D0BCFF;
      color: #381E72;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform .2s ease;
    }

    .play-btn:active { transform: scale(.92); }
    .play-btn svg { width: 24px; height: 24px; }
    .play-btn .pause { display: none; }
    .player.playing .play-btn .play { display: none; }
    .player.playing .play-btn .pause { display: block; }

    .wave {
      position: relative;
      flex: 1;
      height: 32px;
      cursor: pointer;
      overflow: hidden;
    }

    .wave-layer {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      overflow: hidden;
    }

    .wave-bg { width: 100%; }
    .wave-fg { width: 0%; }

    .wave svg {
      display: block;
      animation: flow 1s linear infinite;
      animation-play-state: paused;
    }

    .player.playing .wave svg { animation-play-state: running; }

    @keyframes flow {
      from { transform: translateX(0); }
      to   { transform: translateX(-20px); }
    }

    .wave path {
      fill: none;
      stroke-width: 4;
      stroke-linecap: round;
    }

    .wave-bg path { stroke: rgba(208,188,255,.3); }
    .wave-fg path { stroke: #D0BCFF; }

    .cover {
      flex: none;
      position: relative;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      overflow: hidden;
      background: #4A3A63;
      color: #EADDFF;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cover svg { width: 24px; height: 24px; }

    .cover img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .player.playing .cover { animation: spin 14s linear infinite; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ---------- карточка ---------- */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      padding: 40px 24px 48px;
      text-align: center;
      background: rgba(43, 27, 61, .85);
      backdrop-filter: blur(6px);
      border-radius: 32px;
      animation: fadeUp .8s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      display: block;
      width: 112px;
      height: 112px;
      margin: 0 auto 20px;
      object-fit: cover;
      border-radius: 36%;
      border: 3px solid #4A3A63;
      background: #4A3A63;
    }

    h1 { font-size: 34px; color: #EADDFF; }
    .meta { margin-top: 8px; font-size: 18px; }

    .links {
      margin-top: 32px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 24px;
      border-radius: 999px;
      background: #4A3A63;
      color: #EADDFF;
      text-decoration: none;
      font-size: 16px;
      transition: transform .2s ease;
    }

    .btn:active { transform: scale(.96); }
    .btn.primary { background: #D0BCFF; color: #381E72; }

    @media (prefers-reduced-motion: reduce) {
      .bubble, .card, .player, .wave svg, .player.playing .cover { animation: none; }
      .bubble { display: none; }
    }
  </style>
</head>
<body>
  <div class="bubbles" id="bubbles"></div>

  <div class="player" id="player">
    <button class="play-btn" id="playBtn" aria-label="Музыка">
      <svg class="play" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
      <svg class="pause" viewBox="0 0 24 24"><path fill="currentColor" d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>

    <div class="wave" id="wave">
      <div class="wave-layer wave-bg"><svg><path/></svg></div>
      <div class="wave-layer wave-fg" id="waveFg"><svg><path/></svg></div>
    </div>

    <div class="cover">
      <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
      <img src="cover.jpg" alt="" onerror="this.style.display='none'">
    </div>
  </div>

  <main class="card">
    <img class="avatar" src="avatar.jpg" alt="texmacros"
         onerror="this.onerror=null;this.src='https://github.com/texmacros.png'">
    <h1>texmacros</h1>
    <p class="meta">13.10.2005 · tashkent</p>

    <div class="links">
      <a class="btn primary" href="https://t.me/texmac">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M9.78,18.65L10.06,14.42L17.74,7.5C18.08,7.19 17.67,7.04 17.22,7.31L7.74,13.3L3.64,12C2.76,11.75 2.75,11.14 3.84,10.7L19.81,4.54C20.54,4.21 21.24,4.72 20.96,5.84L18.24,18.65C18.05,19.56 17.5,19.78 16.74,19.36L12.6,16.3L10.61,18.23C10.38,18.46 10.19,18.65 9.78,18.65Z"/></svg>
        @texmac
      </a>
      <a class="btn" href="mailto:texmacros@gmail.com">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 7l9 6 9-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        texmacros@gmail.com
      </a>
      <a class="btn" href="tel:+998338696969">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
        +998 33 869 69 69
      </a>
    </div>
  </main>

  <audio id="audio" src="music.mp3" loop preload="metadata"></audio>

  <script>
    /* пузырьки */
    var box = document.getElementById('bubbles');
    for (var i = 0; i < 18; i++) {
      var b = document.createElement('span');
      var size = 20 + Math.random() * 70;
      b.className = 'bubble';
      b.style.width = b.style.height = size + 'px';
      b.style.left = Math.random() * 100 + '%';
      b.style.animationDuration = (9 + Math.random() * 10) + 's';
      b.style.animationDelay = (-Math.random() * 18) + 's';
      b.style.setProperty('--drift', (Math.random() * 80 - 40) + 'px');
      box.appendChild(b);
    }

    /* волна */
    var wave = document.getElementById('wave');
    var waveFg = document.getElementById('waveFg');
    var svgs = wave.querySelectorAll('svg');

    function drawWave() {
      var W = wave.clientWidth;
      var n = Math.ceil((W + 40) / 10) + 1;
      var d = 'M0 16 q5 -8 10 0';
      for (var i = 1; i < n; i++) d += ' t10 0';
      for (var j = 0; j < svgs.length; j++) {
        var s = svgs[j];
        s.setAttribute('width', W + 40);
        s.setAttribute('height', 32);
        s.setAttribute('viewBox', '0 0 ' + (W + 40) + ' 32');
        s.querySelector('path').setAttribute('d', d);
      }
    }
    drawWave();
    window.addEventListener('resize', drawWave);

    /* плеер */
    var audio = document.getElementById('audio');
    var player = document.getElementById('player');
    var playBtn = document.getElementById('playBtn');

    playBtn.addEventListener('click', function () {
      if (audio.paused) {
        audio.play().then(function () {
          player.classList.add('playing');
        }).catch(function () {});
      } else {
        audio.pause();
        player.classList.remove('playing');
      }
    });

    audio.addEventListener('timeupdate', function () {
      if (audio.duration) {
        waveFg.style.width = (audio.currentTime / audio.duration * 100) + '%';
      }
    });

    wave.addEventListener('click', function (e) {
      if (!audio.duration) return;
      var r = wave.getBoundingClientRect();
      var ratio = Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1);
      audio.currentTime = ratio * audio.duration;
    });
  </script>
</body>
</html>
