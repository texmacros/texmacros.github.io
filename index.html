<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1E1230" id="themeColor">
  <title>texmacros</title>
  <style>
    /* ---------- color themes ---------- */
    :root {
      --accent-rgb: 208,188,255;
      --bg: #1E1230;
      --surface: rgba(43, 27, 61, .85);
      --surface2: #4A3A63;
      --tile: rgba(74, 58, 99, .55);
      --text: #EADDFF;
      --text2: #CCC2DC;
      --on-accent: #381E72;
      --up: #B5E2BE;
      --down: #F9B8B4;
    }

    html[data-theme="brown"] {
      --accent-rgb: 232,191,168;
      --bg: #1F140F;
      --surface: rgba(52, 35, 27, .88);
      --surface2: #5A4034;
      --tile: rgba(90, 64, 52, .55);
      --text: #FBE5DA;
      --text2: #D8C2B8;
      --on-accent: #3F2517;
    }

    html[data-theme="teal"] {
      --accent-rgb: 159,214,206;
      --bg: #0E1D1B;
      --surface: rgba(23, 45, 42, .88);
      --surface2: #2F4F4A;
      --tile: rgba(47, 79, 74, .55);
      --text: #D6F2EE;
      --text2: #B2CCC8;
      --on-accent: #00372F;
    }

    html[data-theme="blue"] {
      --accent-rgb: 174,198,255;
      --bg: #0F1829;
      --surface: rgba(24, 36, 64, .88);
      --surface2: #33466E;
      --tile: rgba(51, 70, 110, .55);
      --text: #DCE6FF;
      --text2: #B9C6E4;
      --on-accent: #0B2A63;
    }

    * { box-sizing: border-box; margin: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 20px 88px;
      background: var(--bg);
      font-family: Roboto, Arial, sans-serif;
      color: var(--text2);
      overflow-x: hidden;
      transition: background .4s ease;
    }

    /* ---------- animated background ---------- */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .bubble {
      position: absolute;
      bottom: -140px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(var(--accent-rgb), .35), rgba(var(--accent-rgb), .06));
      border: 1px solid rgba(var(--accent-rgb), .25);
      animation: rise linear infinite;
    }

    @keyframes rise {
      0%   { transform: translate(0, 0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translate(var(--drift), calc(-100vh - 280px)); opacity: 0; }
    }

    .shape {
      position: absolute;
      bottom: -120px;
      color: rgb(var(--accent-rgb));
      opacity: 0;
      animation: float linear infinite;
    }

    .shape svg {
      display: block;
      width: 100%;
      height: 100%;
      animation: turn var(--dur, 20s) linear infinite;
    }

    @keyframes float {
      0%   { transform: translate(0, 0); opacity: 0; }
      10%  { opacity: var(--o, .2); }
      90%  { opacity: var(--o, .2); }
      100% { transform: translate(var(--drift), calc(-100vh - 240px)); opacity: 0; }
    }

    @keyframes turn {
      to { transform: rotate(var(--turn, 360deg)); }
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      will-change: transform;
    }

    .blob.b1 {
      width: 70vmax; height: 70vmax;
      left: -20vmax; top: -20vmax;
      background: rgba(var(--accent-rgb), .22);
      animation: drift1 22s ease-in-out infinite alternate;
    }

    .blob.b2 {
      width: 60vmax; height: 60vmax;
      right: -22vmax; top: 25vh;
      background: var(--surface2);
      opacity: .6;
      animation: drift2 26s ease-in-out infinite alternate;
    }

    .blob.b3 {
      width: 55vmax; height: 55vmax;
      left: 8vmax; bottom: -28vmax;
      background: rgba(var(--accent-rgb), .15);
      animation: drift3 30s ease-in-out infinite alternate;
    }

    @keyframes drift1 { to { transform: translate(18vmax, 12vmax) scale(1.15); } }
    @keyframes drift2 { to { transform: translate(-16vmax, -10vmax) scale(1.1); } }
    @keyframes drift3 { to { transform: translate(14vmax, -14vmax) scale(1.2); } }

    .gridlayer {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(var(--accent-rgb), .32) 1.2px, transparent 1.6px);
      background-size: 26px 26px;
      -webkit-mask-image: radial-gradient(ellipse at 50% 40%, #000 25%, transparent 78%);
      mask-image: radial-gradient(ellipse at 50% 40%, #000 25%, transparent 78%);
      animation: gridmove 40s linear infinite;
    }

    @keyframes gridmove {
      to { background-position: 26px 26px; }
    }

    /* ---------- page layout ---------- */
    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .rise-in {
      animation: fadeUp .7s ease both;
      animation-delay: calc(var(--i, 0) * 80ms);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card {
      background: var(--surface);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 28px;
      padding: 20px;
      transition: background .4s ease;
    }

    .section-label {
      padding-left: 8px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text2);
      opacity: .8;
    }

    /* ---------- hero ---------- */
    .hero {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .avatar {
      flex: none;
      width: 88px;
      height: 88px;
      object-fit: cover;
      border-radius: 36%;
      border: 3px solid var(--surface2);
      background: var(--surface2);
    }

    h1 {
      font-size: 30px;
      line-height: 1.1;
      color: var(--text);
    }

    .chips {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--surface2);
      color: var(--text);
      font-size: 13px;
    }

    /* ---------- weather + rate tiles ---------- */
    .info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .tile {
      display: block;
      padding: 16px;
      border-radius: 24px;
      background: var(--tile);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: var(--text);
      text-decoration: none;
      text-align: left;
      transition: background .4s ease;
    }

    a.tile { transition: transform .2s ease, background .4s ease; }
    a.tile:active { transform: scale(.97); }

    .tile .label {
      font-size: 12px;
      letter-spacing: .04em;
      color: var(--text2);
    }

    .tile .value {
      margin-top: 8px;
      font-size: clamp(18px, 5.2vw, 26px);
      font-weight: 700;
      line-height: 1.15;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .tile .sub {
      margin-top: 8px;
      font-size: 12px;
      color: var(--text2);
    }

    .up   { color: var(--up); }
    .down { color: var(--down); }

    /* ---------- contacts ---------- */
    .list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 12px;
      border-radius: 20px;
      background: var(--tile);
      color: var(--text);
      text-decoration: none;
      transition: transform .2s ease, background .4s ease;
    }

    .item:active { transform: scale(.98); }

    .ico {
      flex: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgb(var(--accent-rgb));
      color: var(--on-accent);
    }

    .ico svg { width: 22px; height: 22px; }

    .txt {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .txt b {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .04em;
      color: var(--text2);
    }

    .txt span {
      font-size: 16px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .chev {
      flex: none;
      width: 20px;
      height: 20px;
      color: var(--text2);
    }

    .credit {
      text-align: center;
      font-size: 11px;
      color: var(--text2);
      opacity: .7;
    }

    .credit a { color: inherit; }

    /* ---------- appearance panel ---------- */
    .fab {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 6;
      width: 56px;
      height: 56px;
      border: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgb(var(--accent-rgb));
      color: var(--on-accent);
      box-shadow: 0 4px 16px rgba(0, 0, 0, .35);
      cursor: pointer;
      transition: transform .2s ease;
    }

    .fab:active { transform: scale(.92); }
    .fab svg { width: 26px; height: 26px; }

    .panel {
      position: fixed;
      right: 16px;
      bottom: 84px;
      z-index: 6;
      width: min(300px, calc(100vw - 32px));
      padding: 16px;
      border-radius: 28px;
      background: var(--bg);
      border: 1px solid rgba(var(--accent-rgb), .25);
      box-shadow: 0 8px 32px rgba(0, 0, 0, .45);
      animation: fadeUp .25s ease both;
    }

    .panel[hidden] { display: none; }

    .p-title {
      margin: 4px 0 10px;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text2);
    }

    .p-title:not(:first-child) { margin-top: 16px; }

    .opts {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .opt {
      border: 0;
      padding: 9px 14px;
      border-radius: 999px;
      background: var(--tile);
      color: var(--text);
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      transition: transform .2s ease;
    }

    .opt:active { transform: scale(.95); }

    .opt.on {
      background: rgb(var(--accent-rgb));
      color: var(--on-accent);
    }

    .swatches {
      display: flex;
      gap: 12px;
    }

    .sw {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid transparent;
      cursor: pointer;
      transition: transform .2s ease;
    }

    .sw:active { transform: scale(.9); }
    .sw.on { border-color: var(--text); }
    .sw[data-pick="purple"] { background: #D0BCFF; }
    .sw[data-pick="brown"]  { background: #E8BFA8; }
    .sw[data-pick="teal"]   { background: #9FD6CE; }
    .sw[data-pick="blue"]   { background: #AEC6FF; }

    @media (prefers-reduced-motion: reduce) {
      .rise-in, .panel, .gridlayer, .blob { animation: none; }
      .bubble, .shape { display: none; }
    }
  </style>
</head>

  <button class="fab" id="fab" aria-label="Appearance" aria-expanded="false">

  <div class="panel" id="panel" hidden>

      <button class="opt" data-mode="bubbles">bubbles</button>
      <button class="opt" data-mode="aurora">aurora</button>

      <button class="opt" data-mode="plain">plain</button>

      <button class="sw" data-pick="brown" aria-label="brown"></button>

  <script>
    function pickRandom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function loadSetting(key, allowed, fallback) {
      try {
        var v = localStorage.getItem(key);
        if (v && allowed.indexOf(v) !== -1) return v;
      } catch (e) {}
      return fallback;
    }

    function saveSetting(key, value) {
      try { localStorage.setItem(key, value); } catch (e) {}
    }

    /* ---------- background modes ---------- */
    var MODES = ['shapes', 'bubbles', 'aurora', 'grid', 'plain'];
    var THEMES = ['purple', 'brown', 'teal', 'blue'];
    var bg = document.getElementById('bg');

    var SHAPES = [
      '<circle cx="12" cy="12" r="11"/>',
      '<rect x="2" y="2" width="20" height="20" rx="6"/>',
      '<polygon points="12,4 21,20 3,20" stroke-width="3"/>',
      '<polygon points="12,2 22,12 12,22 2,12" stroke-width="3"/>',
      '<path d="M12 1Q13.5 10.5 23 12Q13.5 13.5 12 23Q10.5 13.5 1 12Q10.5 10.5 12 1Z"/>',
      '<circle cx="12" cy="6.5" r="5"/><circle cx="12" cy="17.5" r="5"/><circle cx="6.5" cy="12" r="5"/><circle cx="17.5" cy="12" r="5"/>',
      '<circle cx="12" cy="12" r="8.5" fill="none" stroke-width="3"/>',
      '<rect x="1" y="7" width="22" height="10" rx="5"/>',
      '<polygon points="12,2 21,7 21,17 12,22 3,17 3,7" stroke-width="3"/>'
    ];

    function makeShape() {
      var el = document.createElement('span');
      var size = 28 + Math.random() * 56;
      var dur = 14 + Math.random() * 14;
      var dir = Math.random() < 0.5 ? -1 : 1;
      el.className = 'shape';
      el.style.width = el.style.height = size + 'px';
      el.style.left = Math.random() * 100 + '%';
      el.style.animationDuration = dur + 's';
      el.style.animationDelay = (-Math.random() * dur) + 's';
      el.style.setProperty('--drift', (Math.random() * 120 - 60) + 'px');
      el.style.setProperty('--o', (0.14 + Math.random() * 0.2).toFixed(2));
      el.style.setProperty('--dur', (10 + Math.random() * 14) + 's');
      el.style.setProperty('--turn', dir * (180 + Math.random() * 360) + 'deg');
      el.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" '
        + 'stroke-linejoin="round" stroke-width="1">' + pickRandom(SHAPES) + '</svg>';
      return el;
    }

    function makeBubble() {
      var el = document.createElement('span');
      var size = 20 + Math.random() * 70;
      el.className = 'bubble';
      el.style.width = el.style.height = size + 'px';
      el.style.left = Math.random() * 100 + '%';
      el.style.animationDuration = (9 + Math.random() * 10) + 's';
      el.style.animationDelay = (-Math.random() * 18) + 's';
      el.style.setProperty('--drift', (Math.random() * 80 - 40) + 'px');
      return el;
    }

    function addEl(cls) {
      var el = document.createElement('span');
      el.className = cls;
      bg.appendChild(el);
    }

    function renderBg(mode) {
      bg.innerHTML = '';
      var i;
      if (mode === 'shapes') {
        for (i = 0; i < 16; i++) bg.appendChild(makeShape());
      } else if (mode === 'bubbles') {
        for (i = 0; i < 18; i++) bg.appendChild(makeBubble());
      } else if (mode === 'aurora') {
        addEl('blob b1'); addEl('blob b2'); addEl('blob b3');
      } else if (mode === 'grid') {
        addEl('gridlayer');
      }
    }

    /* ---------- appearance panel ---------- */
    var fab = document.getElementById('fab');
    var panel = document.getElementById('panel');
    var bgOpts = document.getElementById('bgOpts');
    var themeOpts = document.getElementById('themeOpts');
    var themeColor = document.getElementById('themeColor');

    function markActive(container, attr, value) {
      container.querySelectorAll('[' + attr + ']').forEach(function (b) {
        b.classList.toggle('on', b.getAttribute(attr) === value);
      });
    }

    function setMode(mode) {
      renderBg(mode);
      markActive(bgOpts, 'data-mode', mode);
      saveSetting('bg', mode);
    }

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      markActive(themeOpts, 'data-pick', theme);
      saveSetting('theme', theme);
      var c = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
      if (c) themeColor.setAttribute('content', c);
    }

    function togglePanel(open) {
      var show = typeof open === 'boolean' ? open : panel.hidden;
      panel.hidden = !show;
      fab.setAttribute('aria-expanded', show ? 'true' : 'false');
    }

    fab.addEventListener('click', function (e) {
      e.stopPropagation();
      togglePanel();
    });

    panel.addEventListener('click', function (e) { e.stopPropagation(); });

    bgOpts.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-mode]');
      if (btn) setMode(btn.getAttribute('data-mode'));
    });

    themeOpts.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-pick]');
      if (btn) setTheme(btn.getAttribute('data-pick'));
    });

    document.addEventListener('click', function () { togglePanel(false); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') togglePanel(false);
    });

    setTheme(loadSetting('theme', THEMES, 'purple'));
    setMode(loadSetting('bg', MODES, 'shapes'));

    /* ---------- helper: fetch JSON with a timeout ---------- */
    function fetchJson(url, ms) {
      var ctrl = new AbortController();
      var timer = setTimeout(function () { ctrl.abort(); }, ms);
      return fetch(url, { signal: ctrl.signal }).then(function (r) {
        clearTimeout(timer);
        if (!r.ok) throw new Error('bad response');
        return r.json();
      }, function (e) {
        clearTimeout(timer);
        throw e;
      });
    }

    /* ---------- weather: Open-Meteo ---------- */
    var wValue = document.getElementById('wValue');
    var wSub = document.getElementById('wSub');

    function describe(code, isDay) {
      if (code === 0) return ['clear', isDay ? '\u2600\uFE0F' : '\uD83C\uDF19'];
      if (code === 1) return ['mostly clear', isDay ? '\uD83C\uDF24\uFE0F' : '\uD83C\uDF19'];
      if (code === 2) return ['partly cloudy', '\u26C5'];
      if (code === 3) return ['overcast', '\u2601\uFE0F'];
      if (code === 45 || code === 48) return ['fog', '\uD83C\uDF2B\uFE0F'];
      if (code >= 51 && code <= 57) return ['drizzle', '\uD83C\uDF26\uFE0F'];
      if (code >= 61 && code <= 67) return ['rain', '\uD83C\uDF27\uFE0F'];
      if (code >= 71 && code <= 77) return ['snow', '\u2744\uFE0F'];
      if (code >= 80 && code <= 82) return ['showers', '\uD83C\uDF26\uFE0F'];
      if (code === 85 || code === 86) return ['snow showers', '\uD83C\uDF28\uFE0F'];
      if (code >= 95) return ['thunderstorm', '\u26C8\uFE0F'];
      return ['weather', '\uD83C\uDF21\uFE0F'];
    }

    function loadWeather() {
      var url = 'https://api.open-meteo.com/v1/forecast'
        + '?latitude=41.2995&longitude=69.2401'
        + '&current=temperature_2m,apparent_temperature,weather_code,is_day'
        + '&timezone=Asia%2FTashkent';
      fetchJson(url, 8000).then(function (j) {
        var c = j.current;
        var d = describe(c.weather_code, c.is_day);
        wValue.textContent = d[1] + ' ' + Math.round(c.temperature_2m) + '\u00B0';
        wSub.textContent = d[0] + ' \u00B7 feels ' + Math.round(c.apparent_temperature) + '\u00B0';
      }).catch(function () {
        wValue.textContent = '\u2014';
        wSub.textContent = 'unavailable';
      });
    }

    loadWeather();
    setInterval(loadWeather, 15 * 60 * 1000);

    /* ---------- USD rate: Central Bank of Uzbekistan ---------- */
    var rValue = document.getElementById('rValue');
    var rDiff = document.getElementById('rDiff');
    var rDate = document.getElementById('rDate');
    var RATE_URL = 'https://cbu.uz/ru/arkhiv-kursov-valyut/json/USD/';
    var CACHE_KEY = 'usd_cbu';

    function dateValue(s) {
      var p = String(s).split('.');
      return new Date(+p[2], +p[1] - 1, +p[0]).getTime() || 0;
    }

    function showRate(item, saved) {
      var rate = parseFloat(item.Rate);
      var diff = parseFloat(item.Diff);
      if (!rate) throw new Error('bad rate');

      rValue.textContent = rate.toLocaleString('ru-RU', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });

      rDiff.className = '';
      rDiff.textContent = '';
      if (diff > 0) {
        rDiff.className = 'up';
        rDiff.textContent = '\u25B2 ' + diff.toFixed(2) + ' \u00B7 ';
      } else if (diff < 0) {
        rDiff.className = 'down';
        rDiff.textContent = '\u25BC ' + Math.abs(diff).toFixed(2) + ' \u00B7 ';
      }
      rDate.textContent = item.Date + (saved ? ' (saved)' : '');
    }

    function loadRate() {
      var cached = null;
      try { cached = JSON.parse(localStorage.getItem(CACHE_KEY)); } catch (e) {}
      if (cached) {
        try { showRate(cached, true); } catch (e) {}
      }

      fetchJson(RATE_URL, 8000).then(function (data) {
        var list = (Array.isArray(data) ? data : []).filter(function (x) {
          return x && x.Ccy === 'USD';
        });
        if (!list.length) throw new Error('empty');
        list.sort(function (a, b) { return dateValue(b.Date) - dateValue(a.Date); });
        var item = list[0];
        showRate(item, false);
        try {
          localStorage.setItem(CACHE_KEY, JSON.stringify({
            Rate: item.Rate, Diff: item.Diff, Date: item.Date
          }));
        } catch (e) {}
      }).catch(function () {
        if (!cached) {
          rValue.textContent = '\u2014';
          rDiff.textContent = '';
          rDate.textContent = 'unavailable';
        }
      });
    }

    loadRate();
  </script>
</body>
</html>
